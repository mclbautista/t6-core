[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "t6"
version = "0.3.8"
description = "Shared T6 domain and tool adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
notion = ["httpx>=0.27,<1"]
privacy = []
llm = [
    "pydantic>=2.7,<3",
]
frameio = []
resolve = ["psycopg[binary]>=3.2,<4"]
instagantt = []
lookup = ["rapidfuzz>=3.9,<4"]
drives = ["openpyxl>=3.1,<4"]
server = []
worker = []

[project.scripts]
t6 = "t6.cli:main"

[dependency-groups]
dev = [
    "deptry>=0.20,<1",
    "hatchling>=1.26,<2",
    "httpx>=0.27,<1",
    "import-linter>=2.1,<3",
    "mypy>=1.13,<2",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "rapidfuzz>=3.9,<4",
    "types-openpyxl>=3.1,<4",
]

[tool.uv.workspace]
members = []

[tool.hatch.build.targets.wheel]
packages = ["src/t6"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.importlinter]
root_package = "t6"

[[tool.importlinter.contracts]]
name = "t6.domain imports no other t6 package"
type = "forbidden"
source_modules = ["t6.domain"]
forbidden_modules = [
    "t6.consumer", "t6.drives", "t6.frameio", "t6.instagantt", "t6.llm", "t6.lookup", "t6.notion",
    "t6.operator", "t6.ops", "t6.privacy", "t6.registry", "t6.resolve", "t6.server", "t6.worker",
]

[[tool.importlinter.contracts]]
name = "t6.llm, t6.lookup and t6.privacy stay clear of Notion, Frame.io and the worker"
type = "forbidden"
source_modules = ["t6.llm", "t6.lookup", "t6.privacy"]
forbidden_modules = ["t6.notion", "t6.frameio", "t6.server", "t6.worker", "t6.registry"]
