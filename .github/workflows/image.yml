name: Image

# Pull requests build the t6 image and smoke-test it, and push nothing.
# A vX.Y.Z tag publishes ghcr.io/mclbautista/t6:X.Y.Z and :sha-<short>
# (linux/amd64 only, no `latest`). The tag must equal pyproject's version.

on:
  pull_request:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mclbautista/t6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: t6:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/image-smoke-test.sh t6:smoke

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the pyproject version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $project_version" >&2
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
      - run: |
          echo "Published ${IMAGE}:${VERSION}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
