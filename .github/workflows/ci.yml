name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-contract:
    name: Privacy contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Run privacy contract tests
        run: |
          uv run --locked python -m unittest discover -s tests -p 'test_privacy_*.py' -v
          uv run --locked python -m unittest discover -s tests -p 'test_llm_task.py' -v
          uv run --locked python -m unittest discover -s tests -p 'test_public_repo_safety.py' -v
      - name: Check tracked cases and files for denied names
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          NAMES: ${{ secrets.T6_NAMES_DENYLIST }}
          T6_NAMES_DENYLIST_FILE: ${{ runner.temp }}/t6-names-denylist
        run: |
          printf '%s\n' "$NAMES" > "$T6_NAMES_DENYLIST_FILE"
          python scripts/public_repo_safety.py --skip-secrets --require-names
      - name: Explain fork denylist skip
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Denylist scan skipped for fork pull request; repository secrets are unavailable."

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --locked mypy
      - run: uv run --locked lint-imports
      - run: uv run --locked deptry src
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
